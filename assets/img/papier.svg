<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Feine Papierfasern: Rauschen, warm eingefaerbt, sehr schwach.
       Wird in style.css ueber body::before gekachelt. -->
  <filter id="fasern" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="5" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix"
      values="0 0 0 0 0.42
              0 0 0 0 0.35
              0 0 0 0 0.22
              0 0 0 0.34 0"/>
  </filter>
  <rect width="300" height="300" filter="url(#fasern)"/>
</svg>
