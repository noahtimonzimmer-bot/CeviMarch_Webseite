services:
  kasse:
    build: .
    container_name: ce-march-kasse
    restart: unless-stopped
    # Nur lokal erreichbar - davor laeuft nginx oder Caddy mit HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /daten
      TRUST_PROXY: "true"
      # Nur fuer die Uebergangszeit ohne Zertifikat auf false setzen:
      #   COOKIE_SECURE=false docker compose ... up -d
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      MAX_UPLOAD_MB: "20"
      # Ohne Angabe erzeugt der Server beide Passwoerter und zeigt sie im Log.
      # PASSWORT_LEITUNG: "beim-ersten-Start-setzen"
      # PASSWORT_MITARBEIT: "beim-ersten-Start-setzen"
    volumes:
      - kassendaten:/daten

volumes:
  kassendaten:
