<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d21a37">
<meta name="description" content="Belege, Kassenbuch und Abrechnung des Cevi March.">
<title>Ce March Kasse</title>
<link rel="icon" href="img/logo.jpg">
<link rel="apple-touch-icon" href="img/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ------------------------------------------------------------- Anmeldung -->
<div id="anmeldung" class="anmeldung" hidden>
  <div class="anmelde-karte">
    <img src="img/logo.jpg" alt="Cevi March" class="logo-gross">
    <h1>Ce March Kasse</h1>
    <p class="unterzeile">Belege erfassen, Kasse führen, sauber abrechnen.</p>
    <form id="anmelde-formular">
      <label>Passwort
        <input type="password" name="passwort" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" required>
      </label>
      <p class="fehler" id="anmelde-fehler" hidden></p>
      <button class="knopf primaer breit" type="submit">Anmelden</button>
    </form>
    <p class="hinweis">
      Es gibt ein Passwort für die Abteilungsleitung und eines zum Belege erfassen.
      Beide gibt die Abteilungsleitung weiter.
    </p>
  </div>
</div>

<!-- ----------------------------------------------------------------- App -->
<div id="app" class="app" hidden>
  <header class="kopfleiste">
    <div class="mitte kopf-inhalt">
      <a class="marke" href="#/">
        <img src="img/logo.jpg" alt="" class="logo-klein">
        <span><strong>Ce March</strong> Kasse</span>
      </a>
      <nav id="navigation" class="kopf-navigation"></nav>
    </div>
  </header>

  <main id="ansicht" class="mitte ansicht"></main>

  <footer class="fuss mitte">
    <span id="rollen-text"></span>
    <button class="knopf leise kompakt" id="abmelden">Abmelden</button>
  </footer>
</div>

<div id="meldung" class="meldung" hidden></div>
<dialog id="dialog" class="dialog"></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
